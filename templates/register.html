{% extends "base.html" %}
{% block title %}注册 - AI Chat{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1>AI Chat</h1>
        <p class="auth-subtitle">创建新账号</p>
        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="form-group">
                <input type="text" name="username" placeholder="用户名 (3-20个字符)" required autofocus>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="密码 (至少6个字符)" required>
            </div>
            <div class="form-group">
                <input type="password" name="confirm" placeholder="确认密码" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">注册</button>
        </form>
        <p class="auth-link">已有账号？<a href="{{ url_for('auth.login') }}">去登录</a></p>
    </div>
</div>
{% endblock %}
